# 宿主 profile 可能已经通过官方 bundle 挂载了 worktree / forge（桌面版默认就是），再插一遍会让
# 服务重复注册（service "worktrees" has been registered at ...），所以每行都带守卫让位。
#
# 判据只能读 profileContext.startedBundles，不能读 ctx.loader.entries()：条目按插入顺序逐个激活，
# 兜底行先激活时看不到排在它后面的官方行，会抢注成功；官方行随后全部激活失败，却仍留在树里且
# disabled 为假，于是重载时守卫翻转成禁用，兜底消失、inject 不满足，插件再也起不来。
# startedBundles 是启动时固定的 bundle 清单，两种情况都给出同一个结论，重载不会翻转。
- insert:
    - id: experimental-worktree
      name: '@deepseek-ai/dsh-experimental-worktree'
      disabled: !!js "(ctx.get('profileContext')?.startedBundles ?? []).some((bundle) => bundle === '@deepseek-ai/dsh-experimental-forge-bundle' || bundle === '@deepseek-ai/dsh-experimental-tool-worktree')"
    - id: supermesh-forge
      name: '@deepseek-ai/dsh-experimental-forge'
      disabled: !!js "(ctx.get('profileContext')?.startedBundles ?? []).includes('@deepseek-ai/dsh-experimental-forge-bundle')"
    - id: supermesh-forge-github
      name: '@deepseek-ai/dsh-experimental-forge-github'
      disabled: !!js "(ctx.get('profileContext')?.startedBundles ?? []).includes('@deepseek-ai/dsh-experimental-forge-bundle')"
    - id: supermesh-forge-session
      name: '@deepseek-ai/dsh-experimental-forge-session'
      disabled: !!js "(ctx.get('profileContext')?.startedBundles ?? []).includes('@deepseek-ai/dsh-experimental-forge-bundle')"
    - id: dsh-supermesh
      name: dsh-supermesh
    - id: dsh-taiwind
      name: dsh-taiwind

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup JS
        uses: sxzz/workflows/setup-js@main
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install DSH and Playwright
        shell: bash
        run: |
          pnpm install -g @deepseek-ai/dsh@0.2.2-rc.3
          pnpm exec playwright install --with-deps chromium
          echo "DSH_E2E_CLI=$(pnpm root -g)/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"

      - name: Lint and typecheck
        run: pnpm run lint && pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Test (E2E)
        run: pnpm run test:e2e
        env:
          DSH_E2E_REQUIRED: '1'
